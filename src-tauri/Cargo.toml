[package]
name = "phoenix-weaponeer"
version = "0.2.3"
description = "Phoenix Weaponeer - DCS tactical mission planning and kneeboard generation"
authors = ["Phoenix Squadron"]
edition = "2021"

[lib]
name = "phoenix_weaponeer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
proj = "0.31"
base64 = "0.22"
# Fetching FragOrders public links. rustls, so no OpenSSL on any CI runner.
ureq = "3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
