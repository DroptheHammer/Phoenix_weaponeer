[package]
name = "dcs-attack-planner"
version = "0.1.0"
description = "DCS World Attack Planner - Tactical mission planning and kneeboard generation"
authors = ["Phoenix Squadron"]
edition = "2021"

[lib]
name = "dcs_attack_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "0.6"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
image = "0.25"
rusttype = "0.9"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
