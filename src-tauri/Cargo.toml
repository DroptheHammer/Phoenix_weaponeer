[package]
name = "phoenix-weaponeer"
version = "0.3.1"
description = "Phoenix Weaponeer - DCS tactical mission planning and kneeboard generation"
authors = ["Phoenix Squadron"]
license = "PolyForm-Strict-1.0.0"
edition = "2021"

[lib]
name = "phoenix_weaponeer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Import, coordinates, reference data and profiles, shared with the web build.
weaponeer-core = { path = "../crates/core" }
base64 = "0.22"
# Fetching FragOrders public links. rustls, so no OpenSSL on any CI runner.
ureq = "3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
