[package]
name = "weaponeer-wasm"
version = "0.3.1"
description = "Phoenix Weaponeer's core, exposed to the browser for the web build"
authors = ["Phoenix Squadron"]
license = "PolyForm-Strict-1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
weaponeer-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the wasm-bindgen-cli the build uses; the two must match exactly.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
