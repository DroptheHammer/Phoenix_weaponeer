name: Web app (GitHub Pages)

# Builds the web version (docs/MOBILE_WEB_PLAN.md), so the web app follows
# the desktop app:
# - every push to main: build and check only, never publish. Catches a desktop
#   change that breaks the web build the same day.
# - a desktop release is published (the draft made Latest): build and publish,
#   so the site goes live on the same approval as the installers.
# - "Run workflow" by hand: build and publish, for a fix between releases.
# One-time setup:
# - Settings → Pages → Source: "GitHub Actions".
# - Settings → Environments → github-pages must allow `main` and `v*` tags
#   to deploy (both added 2026-09-26). A release run deploys from its tag.
on:
  push:
    branches: [main]
    # Notes-only pushes skip the build.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main cancels an older build-only run of the same ref.
# Publishing runs never cancel; see the deploy job.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        # Pinned to a commit, as in release.yml.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        # Must match the `=0.2.129` pin in crates/wasm/Cargo.toml exactly.
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Test the shared core
        run: cargo test --manifest-path crates/core/Cargo.toml

      - name: Geometry checks
        run: npm run geo-check

      - name: Build the web app
        # Ends with scripts/web-privacy-check.mjs: no personal paths, private
        # folders or source maps in what gets published.
        run: npm run build:web

      - name: Upload the site
        # Only for runs that publish: a published release or a hand-started run.
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    # Must match the upload condition above.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One publish at a time. A newer one waits instead of cancelling one mid-deploy.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
